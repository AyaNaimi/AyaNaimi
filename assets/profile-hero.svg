<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Aya Naimi — Full Stack Web Developer</title>
  <desc id="d">Premium dark editorial profile banner with geometric accents and asymmetric layout.</desc>
  <defs>
    <linearGradient id="bg0" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#060810"/>
      <stop offset="55%"  stop-color="#09091A"/>
      <stop offset="100%" stop-color="#060C14"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#EC4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="580" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="50%"  stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#EC4899"/>
      <stop offset="80%"  stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gp" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 360) scale(220)">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1100 80) scale(250)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gv" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 200) scale(180)">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base background -->
    <rect width="1200" height="400" fill="url(#bg0)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- Ambient glows -->
    <rect width="1200" height="400" fill="url(#gp)"/>
    <rect width="1200" height="400" fill="url(#gb)"/>
    <rect width="1200" height="400" fill="url(#gv)"/>

    <!-- LEFT accent stripe (3px gradient bar) -->
    <rect x="0" y="0" width="3" height="400" fill="url(#stripe)"/>

    <!-- TOP gradient line -->
    <rect x="0" y="0" width="1200" height="1.5" fill="url(#topline)" opacity="0.8"/>

    <!-- Diagonal geometric shape (top-right) -->
    <polygon points="900,0 1200,0 1200,260" fill="#FFFFFF" fill-opacity="0.012"/>
    <polygon points="960,0 1200,0 1200,180" fill="#7C3AED" fill-opacity="0.04"/>

    <!-- Large background number / watermark -->
    <text x="810" y="340" fill="#FFFFFF" fill-opacity="0.025" font-family="'SF Mono', 'Fira Code', monospace" font-size="280" font-weight="800">01</text>

    <!-- ── LEFT SECTION ── -->

    <!-- Eyebrow label -->
    <rect x="38" y="48" width="8" height="8" rx="2" fill="#7C3AED"/>
    <rect x="52" y="52" width="60" height="1" fill="#7C3AED" opacity="0.5"/>
    <text x="38" y="80" fill="#94A3B8" font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="400" letter-spacing="3">FULL STACK DEV</text>

    <!-- Name — oversized, tight tracking -->
    <text x="36" y="162" fill="url(#namegrad)" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-4">Aya</text>
    <text x="36" y="248" fill="url(#namegrad)" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-4">Naimi</text>

    <!-- Underline accent -->
    <rect x="36" y="260" width="340" height="2" rx="1" fill="url(#topline)" opacity="0.6"/>

    <!-- Role line -->
    <text x="38" y="298" fill="#CBD5E1" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="300" letter-spacing="1">React · Next.js · Laravel · PHP · Supabase</text>

    <!-- Status pill -->
    <rect x="38" y="322" width="130" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="56" cy="335" r="4" fill="#10B981"/>
    <circle cx="56" cy="335" r="4" fill="#10B981" opacity="0.4">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="340" fill="#6EE7B7" font-family="'SF Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">Available</text>

    <!-- Morocco tag -->
    <text x="178" y="340" fill="#475569" font-family="'SF Pro Display', sans-serif" font-size="12">📍 Morocco</text>

    <!-- ── VERTICAL DIVIDER ── -->
    <rect x="700" y="60" width="1" height="280" fill="url(#divider)"/>

    <!-- ── RIGHT SECTION — CARDS ── -->

    <!-- Card: Currently building -->
    <rect x="728" y="48" width="440" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8"/>
    <!-- Card accent left border -->
    <rect x="728" y="48" width="3" height="90" rx="1.5" fill="#EC4899" opacity="0.8"/>
    <text x="754" y="74" fill="#64748B" font-family="'SF Mono', monospace" font-size="9" letter-spacing="2" font-weight="500">BUILDING NOW</text>
    <text x="754" y="100" fill="#F1F5F9" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Trimly</text>
    <text x="754" y="122" fill="#64748B" font-family="'SF Pro Display', sans-serif" font-size="12">Web application — React · Laravel</text>

    <!-- Card: Learning -->
    <rect x="728" y="156" width="210" height="84" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8"/>
    <rect x="728" y="156" width="3" height="84" rx="1.5" fill="#7C3AED" opacity="0.8"/>
    <text x="754" y="180" fill="#64748B" font-family="'SF Mono', monospace" font-size="9" letter-spacing="2">LEARNING</text>
    <text x="754" y="206" fill="#A5B4FC" font-family="'SF Pro Display', sans-serif" font-size="15" font-weight="600">Laravel × React</text>
    <text x="754" y="226" fill="#475569" font-family="'SF Pro Display', sans-serif" font-size="11">Chart.js · Next.js perf</text>

    <!-- Card: Education -->
    <rect x="958" y="156" width="210" height="84" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8"/>
    <rect x="958" y="156" width="3" height="84" rx="1.5" fill="#06B6D4" opacity="0.8"/>
    <text x="984" y="180" fill="#64748B" font-family="'SF Mono', monospace" font-size="9" letter-spacing="2">EDUCATION</text>
    <text x="984" y="206" fill="#67E8F9" font-family="'SF Pro Display', sans-serif" font-size="15" font-weight="600">ISGI Morocco</text>
    <text x="984" y="226" fill="#475569" font-family="'SF Pro Display', sans-serif" font-size="11">DTS WebDev · 2024–2026</text>

    <!-- Card: Stack overview -->
    <rect x="728" y="258" width="440" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8"/>
    <!-- mini pills inside card -->
    <g font-family="'SF Mono', monospace" font-size="10" font-weight="600">
      <!-- React -->
      <rect x="748" y="278" width="52" height="18" rx="9" fill="#61DAFB" fill-opacity="0.1" stroke="#61DAFB" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="774" y="291" text-anchor="middle" fill="#67E8F9">React</text>
      <!-- Next -->
      <rect x="808" y="278" width="56" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
      <text x="836" y="291" text-anchor="middle" fill="#CBD5E1">Next.js</text>
      <!-- Laravel -->
      <rect x="872" y="278" width="60" height="18" rx="9" fill="#FF2D20" fill-opacity="0.1" stroke="#FF2D20" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="902" y="291" text-anchor="middle" fill="#FCA5A5">Laravel</text>
      <!-- PHP -->
      <rect x="940" y="278" width="44" height="18" rx="9" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="962" y="291" text-anchor="middle" fill="#C4B5FD">PHP</text>
      <!-- Supabase -->
      <rect x="992" y="278" width="66" height="18" rx="9" fill="#3ECF8E" fill-opacity="0.1" stroke="#3ECF8E" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="1025" y="291" text-anchor="middle" fill="#6EE7B7">Supabase</text>
      <!-- MySQL -->
      <rect x="1066" y="278" width="54" height="18" rx="9" fill="#4479A1" fill-opacity="0.1" stroke="#4479A1" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="1093" y="291" text-anchor="middle" fill="#7ABFD8">MySQL</text>

      <!-- Row 2 -->
      <rect x="748" y="304" width="62" height="18" rx="9" fill="#F7DF1E" fill-opacity="0.08" stroke="#F7DF1E" stroke-opacity="0.25" stroke-width="0.6"/>
      <text x="779" y="317" text-anchor="middle" fill="#FDE047">JavaScript</text>
      <rect x="818" y="304" width="66" height="18" rx="9" fill="#3178C6" fill-opacity="0.1" stroke="#3178C6" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="851" y="317" text-anchor="middle" fill="#60A5FA">TypeScript</text>
      <rect x="892" y="304" width="56" height="18" rx="9" fill="#38BDF8" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="0.6"/>
      <text x="920" y="317" text-anchor="middle" fill="#7DD3FC">Tailwind</text>
      <rect x="956" y="304" width="58" height="18" rx="9" fill="#47A248" fill-opacity="0.1" stroke="#47A248" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="985" y="317" text-anchor="middle" fill="#86EFAC">MongoDB</text>
      <rect x="1022" y="304" width="52" height="18" rx="9" fill="#5FA04E" fill-opacity="0.1" stroke="#5FA04E" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="1048" y="317" text-anchor="middle" fill="#86EFAC">Node.js</text>
      <rect x="1082" y="304" width="36" height="18" rx="9" fill="#F97316" fill-opacity="0.1" stroke="#F97316" stroke-opacity="0.3" stroke-width="0.6"/>
      <text x="1100" y="317" text-anchor="middle" fill="#FDBA74">Git</text>
    </g>

    <!-- Bottom decorative row -->
    <rect x="728" y="352" width="440" height="0.6" fill="url(#topline)" opacity="0.2"/>

    <!-- Decorative rings (bottom-right corner) -->
    <circle cx="1170" cy="380" r="52" fill="none" stroke="#7C3AED" stroke-opacity="0.1" stroke-width="0.8"/>
    <circle cx="1170" cy="380" r="36" fill="none" stroke="#EC4899" stroke-opacity="0.1" stroke-width="0.6"/>
    <circle cx="1170" cy="380" r="20" fill="none" stroke="#06B6D4" stroke-opacity="0.15" stroke-width="0.5"/>

    <!-- Dot cluster (bottom-left decorative) -->
    <circle cx="640" cy="375" r="2" fill="#EC4899" opacity="0.4"/>
    <circle cx="654" cy="375" r="1.5" fill="#7C3AED" opacity="0.3"/>
    <circle cx="665" cy="375" r="1" fill="#06B6D4" opacity="0.25"/>
  </g>
</svg>
