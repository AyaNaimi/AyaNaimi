<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aya Naimi - Full Stack Web Developer</title>
  <desc id="desc">A modern profile banner with Aya Naimi name and web development stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.45" stop-color="#171032"/>
      <stop offset="1" stop-color="#061B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="128" y1="72" x2="1080" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.45 0 1 0 0 0.18 0 0 1 0 0.95 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="1030" cy="76" r="128" fill="#06B6D4" fill-opacity="0.16" filter="url(#glow)"/>
  <circle cx="145" cy="300" r="130" fill="#EC4899" fill-opacity="0.14" filter="url(#glow)"/>

  <path d="M95 88 C245 20 341 148 486 87 C623 30 720 20 844 93 C948 154 1035 142 1110 100" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M106 286 C248 224 365 323 501 262 C637 202 752 216 888 278 C981 321 1050 292 1114 238" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <g transform="translate(82 76)">
    <rect x="0" y="0" width="198" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="24" y="26" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Hello, I'm Aya</text>
  </g>

  <text x="82" y="176" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="0">Aya Naimi</text>
  <text x="86" y="220" fill="#C7D2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Full Stack Web Developer</text>
  <text x="86" y="260" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">React.js  |  Next.js  |  Laravel  |  PHP  |  Supabase  |  MySQL</text>

  <g transform="translate(815 178)">
    <rect x="0" y="0" width="286" height="82" rx="22" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="28" y="34" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Currently building</text>
    <text x="28" y="62" fill="#67E8F9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">EduTrack</text>
  </g>
</svg>
