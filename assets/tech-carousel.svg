<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="carousel-title carousel-desc">
  <title id="carousel-title">Technical Stack — Animated Carousel</title>
  <desc id="carousel-desc">Infinite scrolling carousel of Aya Naimi's technical skills: HTML5, CSS3, JavaScript, TypeScript, PHP, React, Next.js, Laravel, Tailwind, Supabase, MySQL, MongoDB, Node.js, Git.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0A0D16"/>
      <stop offset="100%" stop-color="#08111C"/>
    </linearGradient>

    <!-- Fade masks on edges -->
    <linearGradient id="fade-h" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"    stop-color="#0A0D16"/>
      <stop offset="10%"   stop-color="#0A0D16" stop-opacity="0"/>
      <stop offset="90%"   stop-color="#0A0D16" stop-opacity="0"/>
      <stop offset="100%"  stop-color="#0A0D16"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"    stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="25%"   stop-color="#7C3AED"/>
      <stop offset="55%"   stop-color="#EC4899"/>
      <stop offset="80%"   stop-color="#06B6D4"/>
      <stop offset="100%"  stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-1694px); }
      }
      .track {
        animation: scroll 28s linear infinite;
      }
      .track:hover {
        animation-play-state: paused;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="160" rx="16" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="1" rx="0" fill="url(#accent-line)" opacity="0.6"/>

  <!-- Header section -->
  <text x="48" y="30" fill="#334155" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2">TECH STACK</text>

  <!-- Scrolling track: 14 items × ~121px avg = ~1694px total width; duplicated for seamless loop -->
  <g transform="translate(0 45)">
    <g class="track">

      <!-- SET 1 -->
      <!-- HTML5 -->
      <g transform="translate(48 0)">
        <rect width="100" height="56" rx="10" fill="#111827" stroke="#E34F26" stroke-opacity="0.5" stroke-width="0.8"/>
        <text x="50" y="28" text-anchor="middle" fill="#E34F26" font-family="'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">HTML5</text>
        <text x="50" y="44" text-anchor="middle" fill="#64748B" font-family="'SF Pro Display', 'Segoe UI', system-serif, sans-serif" font-size="10">Markup</text>
