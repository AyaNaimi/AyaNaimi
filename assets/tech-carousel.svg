<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Infinite technical stack carousel</title>
  <desc id="desc">Animated carousel showing Aya Naimi technical skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#141225"/>
      <stop offset="1" stop-color="#061B2E"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="170" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.52" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="black"/>
      <stop offset="0.08" stop-color="white"/>
      <stop offset="0.92" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="fade">
      <rect width="1200" height="190" fill="url(#fadeLeft)"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="190" rx="24" fill="url(#bg)"/>
  <text x="54" y="44" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Technical Stack</text>
  <text x="54" y="72" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Frontend, backend, database, tooling, deployment</text>

  <g mask="url(#fade)" transform="translate(0 92)">
    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1575 0" dur="24s" repeatCount="indefinite"/>

      <g transform="translate(54 0)">
        <rect width="140" height="58" rx="18" fill="#111827" stroke="#7C3AED"/>
